name: Build Saient Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space and memory on runner
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Android package name exists in app.json
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
              app.expo = app.expo || {};
              app.expo.android = app.expo.android || {};
              if (!app.expo.android.package) {
                app.expo.android.package = "com.sbaghba.saient";
                fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
                console.log("Added default android.package: com.sbaghba.saient");
              }
            }
          '

      - name: Expo Prebuild Android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Compile Standalone APK with Gradle
        working-directory: ./android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - uses: actions/upload-artifact@v4
        with:
          name: saient-s25u-apk
          path: android/app/build/outputs/apk/release/*.apk
