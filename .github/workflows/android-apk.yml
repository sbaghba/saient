name: Build Saient Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space and memory on runner
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Android package name exists in app.json
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
              app.expo = app.expo || {};
              app.expo.android = app.expo.android || {};
              if (!app.expo.android.package) {
                app.expo.android.package = "com.sbaghba.saient";
                fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
                console.log("Added default android.package: com.sbaghba.saient");
              }
            }
          '

      - name: Expo Prebuild Android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Embed Standalone JS Bundle into Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file "$(node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (fs.existsSync("index.js")) console.log("index.js");
              else if (fs.existsSync("index.ts")) console.log("index.ts");
              else if (fs.existsSync("index.tsx")) console.log("index.tsx");
              else if (pkg.main) console.log(require.resolve(pkg.main));
              else console.log(require.resolve("expo/AppEntry.js"));
            ')" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Configure Gradle for Standalone Execution
        run: |
          rm -rf android/app/src/main/res/drawable-*/*.ttf || true
          rm -rf android/app/src/main/res/raw/*.ttf || true
          if grep -q "react {" android/app/build.gradle; then
            sed -i 's/react {/react {\n    debuggableVariants = []/' android/app/build.gradle
          fi

      - name: Compile APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x bundleDebugJsAndAssets -x createBundleDebugJsAndAssets --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - uses: actions/upload-artifact@v4
        with:
          name: saient-s25u-apk
          path: android/app/build/outputs/apk/debug/*.apk
